<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Fale Conosco</title>
  <link rel="stylesheet" href="estilo.css">
  <script>
    function formulario() {
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;
      console.log("Nome: " + nome + " | Email: " + email + " | Mensagem: " + message);
      alert("Dado Enviado.");
    }
  </script>
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html"><img src="Fotos para trabalho web/Logo.png" alt="Logo"></a>
    </div>
    <div class="menu-link"><a href="index.html">Página Inicial</a></div>
    <div class="menu-link"><a href="sobre.html">Sobre nós</a></div>
    <div class="menu-link"><a href="faleconosco.html">Fale Conosco</a></div>
  </header>

  <main>
    <form>
      <h2>Deixe sua mensagem ou pedido</h2>

      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Sua mensagem:</label>
      <textarea id="message" name="message" rows="8" required></textarea>

      <button type="button" onclick="formulario()">Enviar</button>
    </form>
  </main>

  <footer>
    <div>Nosdex amplification<br>CNPJ: 44.444.444/4444-44</div>
    <div>Conheça nossas redes:</div>
    <div><a href="https://www.facebook.com/" target="_blank"><img src="Fotos para trabalho web/facebook.png" alt="Facebook"></a></div>
    <div><a href="https://www.instagram.com/" target="_blank"><img src="Fotos para trabalho web/instagram.png" alt="Instagram"></a></div>
  </footer>
</body>
</html>
